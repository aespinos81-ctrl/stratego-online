# Publica el juego en GitHub Pages cada vez que se sube algo a la rama principal.
# Compila el cliente (la versión contra la IA, que no necesita servidor) y sube
# el resultado. El servidor de Socket.io NO se despliega aquí: eso vendrá cuando
# montemos el multijugador, y necesitará otro tipo de alojamiento.

name: Publicar el juego

on:
  push:
    branches: [main]
  workflow_dispatch:      # permite lanzarlo a mano desde la web de GitHub

permissions:
  contents: read
  pages: write
  id-token: write

# Si se suben dos cambios seguidos, que solo se publique el último
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm install y no npm ci: el lock se genera en macOS y algunas
      # dependencias opcionales son distintas en Linux, que es donde corre esto.
      # npm ci exige coincidencia exacta y se cae por esa diferencia.
      - name: Instalar dependencias del cliente
        working-directory: client
        run: npm install --no-audit --no-fund

      - name: Comprobar las reglas antes de publicar
        run: npm test

      - name: Compilar
        working-directory: client
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
